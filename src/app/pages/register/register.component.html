<div class="auth-container">
  <app-auth-hero class="anim-left" #authHero aria-hidden="true"></app-auth-hero>

  <div class="auth-box">
    <h2 class="title">FREPPING</h2>
    <h3>Create Account</h3>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="register-name">Name</label>
        <input id="register-name" type="text" formControlName="name" class="form-control" [ngClass]="{ 'is-invalid': registerForm.get('name')?.invalid && registerForm.get('name')?.touched }" />
        <div *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched" class="invalid-feedback">
          Name is required.
        </div>
      </div>

      <div class="form-group">
        <label for="register-email">Email</label>
        <input id="register-email" type="email" formControlName="email" class="form-control" [ngClass]="{ 'is-invalid': registerForm.get('email')?.invalid && registerForm.get('email')?.touched }" />
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="invalid-feedback">
          Valid email is required.
        </div>
      </div>

      <div class="form-group">
        <label for="register-password">Password</label>
        <div class="password-input-wrapper">
          <input
            id="register-password"
            [type]="authHero.isPasswordVisible ? 'text' : 'password'"
            formControlName="password"
            class="form-control"
            [ngClass]="{ 'is-invalid': registerForm.get('password')?.invalid && registerForm.get('password')?.touched }"
            (focus)="authHero.onPasswordFocus(registerForm.get('password')?.value?.length || 0)"
            (blur)="authHero.onPasswordBlur()"
          />
          <button
            type="button"
            class="eye-toggle"
            (mousedown)="$event.preventDefault()"
            (click)="authHero.togglePasswordVisibility()"
            [attr.aria-label]="authHero.isPasswordVisible ? 'Hide password' : 'Show password'"
          >
            <svg *ngIf="authHero.isPasswordVisible" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="!authHero.isPasswordVisible" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="invalid-feedback">
          Password must be at least 8 characters.
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">{{error}}</div>

      <button [disabled]="loading" class="btn btn-primary w-100">
        <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
        Register
      </button>

      <div class="links">
        <p>Already have an account? <a routerLink="/login">Log in</a></p>
        <p><a routerLink="/">→ Back to FREPPING</a></p>
      </div>

    </form>
  </div>
</div>
