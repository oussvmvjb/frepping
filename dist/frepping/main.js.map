<div class="auth-container">
  <div class="auth-box">
    <h2 class="title">FREPPING</h2>
    <h3>Create Account</h3>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>First Name</label>
        <input type="text" formControlName="first_name" class="form-control" [ngClass]="{ 'is-invalid': registerForm.get('first_name')?.invalid && registerForm.get('first_name')?.touched }" />
        <div *ngIf="registerForm.get('first_name')?.invalid && registerForm.get('first_name')?.touched" class="invalid-feedback">
          First name is required.
        </div>
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input type="text" formControlName="last_name" class="form-control" [ngClass]="{ 'is-invalid': registerForm.get('last_name')?.invalid && registerForm.get('last_name')?.touched }" />
        <div *ngIf="registerForm.get('last_name')?.invalid && registerForm.get('last_name')?.touched" class="invalid-feedback">
          Last name is required.
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control" [ngClass]="{ 'is-invalid': registerForm.get('email')?.invalid && registerForm.get('email')?.touched }" />
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="invalid-feedback">
          Valid email is required.
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" class="form-control" [ngClass]="{ 'is-invalid': registerForm.get('password')?.invalid && registerForm.get('password')?.touched }" />
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="invalid-feedback">
          Password must be at least 8 characters.
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">{{error}}</div>

      <button [disabled]="loading" class="btn btn-primary w-100">
        <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
        Register
      </button>

      <div class="links">
        <p>Already have an account? <a routerLink="/login">Log in</a></p>
        <p><a routerLink="/">→ Back to FREPPING</a></p>
      </div>

    </form>
  </div>
</div>
