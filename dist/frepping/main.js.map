<div class="auth-container">

  <!-- LEFT: looping background animation -->
  <div class="anim-left">
    <canvas #bgCanvas class="bg-anim-canvas"></canvas>
  </div>

  <!-- RIGHT: existing login card -->
  <div class="auth-box">
    <h2 class="title">FREPPING</h2>
    <h3>Login</h3>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control" [ngClass]="{ 'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched }" />
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="invalid-feedback">
          Valid email is required.
        </div>
      </div>

      <div class="password-anim-wrapper">
        <canvas #animCanvas class="password-anim-canvas"></canvas>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" class="form-control" [ngClass]="{ 'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched }" (focus)="onPasswordFocus()" (blur)="onPasswordBlur()" (keydown)="onPasswordKeydown($event)" />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">
          Password is required.
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">{{error}}</div>

      <button [disabled]="loading" class="btn btn-primary w-100">
        <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
        Login
      </button>

      <div class="links">
        <p>Don't have an account? <a routerLink="/register">Create account</a></p>
        <p><a routerLink="/">→ Back to FREPPING</a></p>
      </div>

    </form>
  </div>
</div>
