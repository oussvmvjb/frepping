<!-- Intro Component -->
<app-intro
  *ngIf="showIntro"
  (loadingFinished)="onLoadingFinished()">
</app-intro>

<!-- Main App Content -->
<ng-container *ngIf="!showIntro">
  <!-- Add cursor elements at the top -->
  <div class="gta-cursor" id="gtaCursor" [style.opacity]="isCursorActive ? '1' : '0'"></div>
  <div class="gta-aim-crosshair" id="gtaAim" [style.opacity]="isCursorActive ? '1' : '0'"></div>

  <!-- Add GTA-style UI overlays -->
  <div class="gta-ui-overlay">
    <!-- Music Toggle -->
    <button class="gta-music-toggle" (click)="toggleAmbience()">
      <i class="fas" [class.fa-volume-up]="isAmbiencePlaying" [class.fa-volume-mute]="!isAmbiencePlaying"></i>
    </button>

 


    <!-- Auth buttons -->
    <div class="gta-auth-actions" style="position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; pointer-events: auto !important; z-index: 99999;">
      <ng-container *ngIf="!(authService.isAuthenticated$ | async)">
        <button type="button" class="gta-btn" routerLink="/login" style="background: rgba(0,0,0,0.7); color: white; border: 2px solid #39ff14; padding: 8px 16px; font-family: 'Pricedown', sans-serif; cursor: pointer; text-transform: uppercase; pointer-events: auto !important;">Login</button>
        <button type="button" class="gta-btn" routerLink="/register" style="background: rgba(0,0,0,0.7); color: white; border: 2px solid #ff9900; padding: 8px 16px; font-family: 'Pricedown', sans-serif; cursor: pointer; text-transform: uppercase; pointer-events: auto !important;">Register</button>
      </ng-container>
      <ng-container *ngIf="authService.isAuthenticated$ | async">
        <button type="button" class="gta-btn" routerLink="/profile" style="background: rgba(0,0,0,0.8); color: #39ff14; border: 2px solid #39ff14; padding: 8px 16px; font-family: 'Pricedown', sans-serif; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; gap: 8px; pointer-events: auto !important;">
          <i class="fas fa-user"></i>
          <span>{{ (authService.currentUser$ | async)?.first_name || (authService.currentUser$ | async)?.email || 'Profile' }}</span>
        </button>
        <button type="button" class="gta-btn" (click)="logout($event)" style="background: rgba(0,0,0,0.8); color: #ff4444; border: 2px solid #ff4444; padding: 8px 16px; font-family: 'Pricedown', sans-serif; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; gap: 8px; pointer-events: auto !important;">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </ng-container>
    </div>

   

    <!-- Wanted level stars -->
    <div class="gta-wanted" *ngIf="wantedLevel > 0">
      <div class="wanted-stars">
        <i *ngFor="let star of getWantedStars()" class="fas fa-star wanted-star" [class.active]="star.active"></i>
      </div>
      <div class="wanted-label">WANTED</div>
    </div>
  </div>

  <!-- Left-Side Navigation -->
  <app-sidebar-nav></app-sidebar-nav>

  <!-- Main App Content -->
  <main class="app-container app-main" [class.app-main--full]="isSidebarHidden">
    <router-outlet></router-outlet>
  </main>
</ng-container>
